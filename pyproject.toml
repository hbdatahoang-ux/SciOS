[build-system]
requires = [
    "setuptools>=80.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

# ============================================================
# Project Metadata
# ============================================================

[project]

name = "scios"

version = "0.1.0"

description = "SciOS - Scientific Cognitive Operating System"

readme = "README.md"

requires-python = ">=3.11"

license = { file = "LICENSE" }

authors = [
    { name = "Bùi Đình Hoàng", email = "hbdatahoang@gmail.com" }
]

maintainers = [
    { name = "Bùi Đình Hoàng", email = "hbdatahoang@gmail.com" }
]

keywords = [
    "scientific-computing",
    "artificial-intelligence",
    "cognitive-architecture",
    "scientific-operating-system",
    "autonomous-agents",
    "reasoning",
    "research-platform",
    "workflow-engine",
    "knowledge-management",
    "artifact-management"
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",

    "License :: OSI Approved :: Apache Software License",

    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "Operating System :: OS Independent",

    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing"
]

dependencies = [
    "numpy>=2.0",
    "pydantic>=2.10",
    "PyYAML>=6.0",
    "networkx>=3.4",
    "typing-extensions>=4.12"
]

dynamic = []

# ============================================================
# Optional Dependencies
# ============================================================

[project.optional-dependencies]

dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "black>=25.0",
    "mypy>=1.16",
    "pre-commit>=4.0"
]

docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30"
]

research = [
    "pandas>=2.3",
    "matplotlib>=3.10",
    "scipy>=1.15",
    "jupyter>=1.1",
    "notebook>=7.4"
]

distributed = [
    "ray>=2.49"
]

llm = [
    "transformers>=4.55",
    "accelerate>=1.10"
]

all = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "black>=25.0",
    "mypy>=1.16",
    "pre-commit>=4.0",

    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.30",

    "pandas>=2.3",
    "matplotlib>=3.10",
    "scipy>=1.15",
    "jupyter>=1.1",

    "ray>=2.49",

    "transformers>=4.55",
    "accelerate>=1.10"
]

# ============================================================
# URLs
# ============================================================

[project.urls]

Homepage = "https://github.com/hbdatahoang-ux/SciOS"

Repository = "https://github.com/hbdatahoang-ux/SciOS"

Issues = "https://github.com/hbdatahoang-ux/SciOS/issues"

Documentation = "https://github.com/hbdatahoang-ux/SciOS/tree/main/docs"

Changelog = "https://github.com/hbdatahoang-ux/SciOS/blob/main/CHANGELOG.md"

# ============================================================
# Console Scripts
# ============================================================

[project.scripts]

scios = "scios.cli:main"

# ============================================================
# Package Discovery
# ============================================================

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

include = ["scios*"]

exclude = [
    "tests*",
    "docs*",
    "examples*",
    "scripts*",
    "notebooks*"
]

# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]

minversion = "8.0"

testpaths = [
    "tests"
]

python_files = [
    "test_*.py"
]

addopts = "-ra"

# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]

source = [
    "scios"
]

omit = [
    "tests/*"
]

# ============================================================
# Ruff
# ============================================================

[tool.ruff]

line-length = 88

target-version = "py311"

# ============================================================
# Black
# ============================================================

[tool.black]

line-length = 88

target-version = [
    "py311"
]

# ============================================================
# MyPy
# ============================================================

[tool.mypy]

python_version = "3.11"

warn_return_any = true

warn_unused_configs = true

disallow_untyped_defs = false

ignore_missing_imports = true