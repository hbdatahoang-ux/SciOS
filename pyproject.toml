[build-system]
requires = [
    "setuptools>=69.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

# ============================================================
# Project Metadata
# ============================================================

[project]
name = "scios"
version = "0.2.0"

description = "Scientific Cognitive Operating System (SciOS)"
readme = "README.md"
license = { file = "LICENSE" }

requires-python = ">=3.11"

authors = [
    { name = "Bui Dinh Hoang" }
]

keywords = [
    "ai",
    "operating-system",
    "cognitive",
    "kernel",
    "scientific",
    "runtime",
    "reasoning",
]

classifiers = [
    "Development Status :: 3 - Alpha",

    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",

    "License :: OSI Approved :: MIT License",

    "Operating System :: OS Independent",

    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

# ============================================================
# Optional Dependencies
# ============================================================

[project.optional-dependencies]

dev = [
    "pytest>=9.0",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
]

docs = [
    "mkdocs",
    "mkdocs-material",
]

# ============================================================
# URLs
# ============================================================

[project.urls]
Homepage = "https://github.com/yourname/SciOS"
Documentation = "https://github.com/yourname/SciOS/docs"
Repository = "https://github.com/yourname/SciOS"
Issues = "https://github.com/yourname/SciOS/issues"

# ============================================================
# Setuptools
# ============================================================

[tool.setuptools]

include-package-data = true

[tool.setuptools.packages.find]

include = [
    "scios",
    "scios.*",
]

# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]

testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

addopts = "-ra"

# ============================================================
# Black
# ============================================================

[tool.black]

line-length = 88
target-version = ["py311"]

# ============================================================
# Ruff
# ============================================================

[tool.ruff]

line-length = 88
target-version = "py311"

# ============================================================
# MyPy
# ============================================================

[tool.mypy]

python_version = "3.11"

strict = false

warn_unused_configs = true

warn_return_any = true

warn_unused_ignores = true