# ============================================================
# SciOS Cognitive Pipeline
# Default Runtime Configuration
# ============================================================

version: "1.0"

pipeline:

  name: "default"

  description: "Default Cognitive Pipeline"

  execution_mode: sequential

  max_workers: 1

  retry_attempts: 1

  timeout: 300

  logging: true

  tracing: true

  metrics: true

  profiling: false

  confidence_threshold: 0.50

  auto_memory_update: true

  fail_fast: false

# ============================================================
# Stage Configuration
# ============================================================

stages:

  perception:

    enabled: true

    implementation: "DefaultPerception"

    timeout: 30

  memory:

    enabled: true

    implementation: "MemoryStage"

    timeout: 30

  reasoning:

    enabled: true

    implementation: "ReasoningStage"

    timeout: 60

  planning:

    enabled: true

    implementation: "PlanningStage"

    timeout: 30

  tool_use:

    enabled: true

    implementation: "ToolUseStage"

    timeout: 120

  reflection:

    enabled: true

    implementation: "ReflectionStage"

    timeout: 60

  memory_update:

    enabled: true

    implementation: "MemoryUpdateStage"

    timeout: 30

# ============================================================
# Execution Graph
# ============================================================

graph:

  type: DAG

  allow_cycles: false

  validate_before_run: true

  auto_topological_sort: true

# ============================================================
# Dispatcher
# ============================================================

dispatcher:

  strategy: sequential

  continue_on_error: false

  emit_events: true

# ============================================================
# Event Bus
# ============================================================

events:

  enabled: true

  history_size: 1000

# ============================================================
# Artifact Manager
# ============================================================

artifacts:

  enabled: true

  validate_metadata: true

  registry_cache: true

# ============================================================
# Memory
# ============================================================

memory:

  semantic: true

  episodic: true

  working: true

  auto_save: true

# ============================================================
# Output
# ============================================================

output:

  format: dict

  pretty: true

  include_trace: false

  include_metrics: false