# dependabot.yml
# Configuration for Dependabot updates

version: 2
updates:
  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "SciOS-NG/devops-team"

  # NPM packages (nếu dự án có frontend hoặc JS tooling)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "SciOS-NG/engineering-team"

  # Python packages (runtime, research modules)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    reviewers:
      - "SciOS-NG/research-team"

  # Docker images (nếu có container build)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    reviewers:
      - "SciOS-NG/devops-team"
