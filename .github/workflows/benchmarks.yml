name: 📊 Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"   # chạy mỗi Chủ Nhật lúc 03:00 UTC

jobs:
  benchmarks:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-benchmark

      - name: Run benchmarks
        run: |
          pytest --benchmark-only --benchmark-save=benchmark-data

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: .benchmarks

      - name: Publish benchmark summary
        run: |
          echo "## Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          pytest --benchmark-only --benchmark-save=benchmark-data --benchmark-json=benchmarks.json
          cat benchmarks.json >> $GITHUB_STEP_SUMMARY
