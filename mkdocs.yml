site_name: SciOS
site_description: Scientific Cognitive Operating System
site_author: Bùi Đình Hoàng
site_url: https://hbdatahoang-ux.github.io/SciOS/

repo_name: hbdatahoang-ux/SciOS
repo_url: https://github.com/hbdatahoang-ux/SciOS

copyright: |
  Copyright © 2026 Bùi Đình Hoàng
  Licensed under the Apache License 2.0.

docs_dir: docs

theme:
  name: material

  language: en

  logo: images/logos/logo.png

  favicon: images/logos/favicon.png

  features:

    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top

    - content.code.copy
    - content.tabs.link

    - search.highlight
    - search.suggest

    - toc.follow

    - content.action.edit
    - content.action.view

markdown_extensions:

  - admonition

  - attr_list

  - tables

  - footnotes

  - md_in_html

  - pymdownx.highlight

  - pymdownx.superfences

  - pymdownx.inlinehilite

  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true

  - toc:
      permalink: true

plugins:

  - search

nav:

  - Home:
      - Overview: README.md

  - Architecture:
      - Overview: architecture/overview.md
      - Kernel: architecture/kernel.md
      - Runtime: architecture/runtime.md
